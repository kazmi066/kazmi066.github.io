<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | Awais Abbas</title>
    <meta name="description" content="Articles by Awais Abbas on frontend development." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch {}
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        if (saved) {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      })();
    </script>
    <meta
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="styles/styles.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:is(.dark *));

      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-primary: var(--primary);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --font-sans: var(--font-sans);
      }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <site-navbar></site-navbar>
    <main id="main-content" class="px-4 pt-16 pb-16">
      <div class="max-w-[768px] mx-auto">
        <section class="mt-2">
          <h1 class="text-2xl sm:text-3xl font-medium">Blog</h1>
          <p class="text-muted-foreground mt-1">
            I try to write a little bit as well.
          </p>
        </section>

        <section class="blogs-section mt-10">
          <ul class="blogs-list" id="blogs-list"></ul>
        </section>

        <site-footer></site-footer>
      </div>
      <script type="module" src="scripts/main.js"></script>
      <script src="components/navbar.component.js"></script>
      <script src="components/footer.component.js"></script>
      <script src="components/external-card-link.component.js"></script>
    </main>
  </body>
</html>
