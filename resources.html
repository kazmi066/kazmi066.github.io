<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resources | Awais Abbas</title>
    <meta name="description" content="Developers and books that shaped how Awais Abbas builds for the web." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pin a saved theme before first paint. With nothing saved, CSS
      // follows the OS on its own.
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.classList.add(saved);
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch {}
    </script>
    <meta
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body class="bg-background text-foreground">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <site-navbar></site-navbar>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="main-content" class="px-4 pt-16 pb-16">
      <div class="max-w-[768px] mx-auto">
        <!-- Page Header -->
        <section>
          <h1 class="text-xl sm:text-2xl font-medium">Resources</h1>
          <p class="text-sm text-muted-foreground mt-1">
            A collection of stuff I find useful and inspiring.
          </p>
        </section>

        <!-- Frontend Goats Section -->
        <section class="mt-8">
          <h2 class="text-base font-medium mb-2">Frontend Goats</h2>
          <p class="text-xs text-muted-foreground mb-3">
            Devs that inspired me the most.
          </p>

          <ul id="frontend-goats-list" class="space-y-1.5"></ul>

          <p class="text-xs text-muted-foreground mt-4 italic">
            Adding more when I remember...
          </p>
        </section>

        <!-- Books Section -->
        <section class="mt-10">
          <h2 class="text-base font-medium mb-2">Books</h2>
          <p class="text-xs text-muted-foreground mb-3">
            Stuff I keep recommending.
          </p>

          <ul id="books-list" class="space-y-1.5"></ul>
        </section>

        <site-footer></site-footer>
      </div>

      <script src="components/navbar.component.js"></script>
      <script src="components/footer.component.js"></script>
      <script>
        const resources = {
          frontendGoats: [
            { label: "Josh W. Comeau", href: "https://www.joshwcomeau.com/" },
            { label: "Andy Bell", href: "https://piccalil.li/author/andy-bell/" },
            { label: "Kevin Powell", href: "https://www.kevinpowell.co/" },
            { label: "Sara Soueidan", href: "https://www.sarasoueidan.com/" },
            { label: "Nadia Makarevich", href: "https://www.developerway.com/" },
            { label: "Kent C. Dodds", href: "https://kentcdodds.com/" },
            { label: "Kyle Simpson", href: "https://me.getify.com/" },
            { label: "Basher", href: "https://github.com/basher" },
            { label: "Wes Bos", href: "https://wesbos.com/" },
          ],
          books: [
            {
              title: "You Don't Know JS (Series)",
              author: "Kyle Simpson",
              href: "https://archive.org/details/kyle-simpson-all-6",
            },
            {
              title: "Advanced React",
              author: "Nadia Makarevic",
              href: "https://www.advanced-react.com/",
            },
            {
              title: "Atomic Design",
              author: "Brad Frost",
              href: "https://atomicdesign.bradfrost.com/",
            },
            {
              title: "Tao of React",
              author: "Alex Kondov",
              href: "https://alexkondov.com/tao-of-react/",
            },
            {
              title: "The Pragmatic Programmer (20th Anniversary Edition)",
              author: "Andy Hunt and Dave Thomas",
              href: "https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/",
            },
          ],
        };

        const frontendGoatsList = document.getElementById(
          "frontend-goats-list",
        );
        if (frontendGoatsList) {
          const goats = Array.isArray(resources.frontendGoats)
            ? resources.frontendGoats
            : [];

          frontendGoatsList.innerHTML = goats
            .map(
              ({ label, href }) => `
                    <li>
                      <a
                        href="${href}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="resource-link inline-flex items-center gap-1">
                        ${label}
                        <span class="arrow transition-transform" aria-hidden="true">→</span>
                        <span class="sr-only">(opens in new tab)</span>
                      </a>
                    </li>
                  `,
            )
            .join("");
        }

        const booksList = document.getElementById("books-list");
        if (booksList) {
          const books = Array.isArray(resources.books) ? resources.books : [];

          booksList.innerHTML = books
            .map(
              ({ title, author, href }) => `
                    <li class="flex items-center justify-between gap-3">
                      <span class="text-sm text-muted-foreground">${title} - ${author}</span>
                      <a
                        href="${href}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="book-link inline-flex items-center gap-1 shrink-0">
                        Book<span class="sr-only">: ${title}</span>
                        <span class="arrow transition-transform" aria-hidden="true">→</span>
                        <span class="sr-only">(opens in new tab)</span>
                      </a>
                    </li>
                  `,
            )
            .join("");
        }
      </script>
    </main>
  </body>
</html>
