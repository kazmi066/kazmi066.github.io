<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skills | Awais Abbas</title>
    <meta name="description" content="Agent skills I use daily, grouped by when I reach for them." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pin a saved theme before first paint. With nothing saved, CSS
      // follows the OS on its own.
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.classList.add(saved);
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch {}
    </script>
    <meta
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body class="bg-background text-foreground">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <site-navbar></site-navbar>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="main-content" class="px-4 pt-16 pb-16">
      <div class="max-w-[768px] mx-auto">
        <section class="mt-2">
          <h1 class="text-2xl sm:text-3xl font-medium">Skills</h1>
          <p class="text-muted-foreground mt-1">
            Agent skills I use daily, grouped by when I reach for them: plan,
            write, review.
          </p>
        </section>

        <div id="skill-categories" class="skill-categories mt-10"></div>

        <site-footer></site-footer>
      </div>
      <script type="module" src="scripts/main.js"></script>
      <script type="module" src="scripts/skills.js"></script>
      <script src="components/navbar.component.js"></script>
      <script src="components/footer.component.js"></script>
    </main>
  </body>
</html>
